<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | BlinkList</title>
  <meta name="description" content="Login to BlinkList as a customer or admin." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS (Style.css holds shared variables/theme/buttons/logo; login.css is this page's own styles) -->
  <link rel="stylesheet" href="Style.css" />
  <link rel="stylesheet" href="login.css" />

  <!-- Apply saved theme before first paint to avoid a flash of the wrong theme -->
  <script>
    (function () {
      var savedTheme = localStorage.getItem('blinklist_theme');
      if (savedTheme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>

  <div id="loginScreen" class="login-screen">

    <!-- Decorative animated background, consistent with the intro page -->
    <div class="login-bg-blobs" aria-hidden="true">
      <span class="blob blob-green"></span>
      <span class="blob blob-yellow"></span>
    </div>

    <div class="login-topbar">
      <a href="intro.html" class="login-back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Back to Home
      </a>

      <button id="loginThemeToggleBtn" class="theme-toggle-btn" title="Switch theme" aria-label="Toggle light and dark theme">
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </div>

    <div class="login-card-wrapper">

      <!-- Step 1: Choose Admin or Customer -->
      <section id="roleSelectStep" class="login-step is-active">
        <div class="login-brand">
          <div class="logo-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
          </div>
          <h1 class="brand-title">Blink<span>List</span></h1>
        </div>

        <h2 class="login-step-title">Welcome back</h2>
        <p class="login-step-subtitle">Choose how you'd like to sign in</p>

        <div class="role-options">
          <button id="chooseCustomerBtn" class="role-card" type="button" data-target="customerFormStep">
            <div class="role-icon role-icon-green">🛒</div>
            <h3>Customer Login</h3>
            <p>Shop groceries and manage your orders</p>
          </button>

          <button id="chooseAdminBtn" class="role-card" type="button" data-target="adminFormStep">
            <div class="role-icon role-icon-yellow">🛡️</div>
            <h3>Admin Login</h3>
            <p>Manage catalog, pricing &amp; GST settings</p>
          </button>
        </div>
      </section>

      <!-- Step 2: Customer email/password + social login -->
      <section id="customerFormStep" class="login-step">
        <button class="login-step-back" type="button" data-target="roleSelectStep">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Back
        </button>

        <div class="login-role-badge role-badge-green">
          <span>🛒</span> Customer Access
        </div>
        <h2 class="login-step-title">Customer Login</h2>
        <p class="login-step-subtitle">Enter your details to continue</p>

        <!-- UI only — not wired to a backend yet -->
        <form id="customerLoginForm" class="login-form">
          <div class="form-group">
            <label for="customerEmail">Email</label>
            <input type="email" id="customerEmail" required placeholder="you@example.com" autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="customerPassword">Password</label>
            <input type="password" id="customerPassword" required placeholder="••••••••" autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-primary login-submit-btn">Login as Customer</button>
        </form>

        <div class="login-divider"><span>or continue with</span></div>

        <div class="social-login-row">
          <button class="social-btn" type="button" title="Continue with Google">
            <svg width="18" height="18" viewBox="0 0 18 18">
              <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
              <path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>
              <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.167 6.656 3.58 9 3.58z"/>
            </svg>
            Google
          </button>
          <button class="social-btn" type="button" title="Continue with Microsoft">
            <svg width="18" height="18" viewBox="0 0 24 24">
              <rect x="2" y="2" width="9" height="9" fill="#F25022"/>
              <rect x="13" y="2" width="9" height="9" fill="#7FBA00"/>
              <rect x="2" y="13" width="9" height="9" fill="#00A4EF"/>
              <rect x="13" y="13" width="9" height="9" fill="#FFB900"/>
            </svg>
            Microsoft
          </button>
          <button class="social-btn" type="button" title="Continue with Apple">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M16.365 1.43c0 1.14-.462 2.24-1.19 3.04-.79.87-2.08 1.55-3.15 1.46-.13-1.09.44-2.25 1.16-3.02.8-.86 2.19-1.5 3.18-1.48zM20.5 17.36c-.55 1.27-.82 1.84-1.53 2.96-.99 1.56-2.39 3.5-4.12 3.51-1.54.02-1.93-.99-4.02-.98-2.09.01-2.52 1-4.06.98-1.73-.02-3.06-1.77-4.05-3.33C.34 17.02-.5 12.32 1.6 9.14c1.09-1.66 2.86-2.68 4.51-2.68 1.7 0 2.76 1 4.17 1 1.37 0 2.19-1 4.17-1 1.53 0 3.14.83 4.29 2.27-3.78 2.07-3.17 7.43 1.76 8.63z"/>
            </svg>
            Apple
          </button>
        </div>
      </section>

      <!-- Step 3: Admin email/password + social login -->
      <section id="adminFormStep" class="login-step">
        <button class="login-step-back" type="button" data-target="roleSelectStep">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Back
        </button>

        <div class="login-role-badge role-badge-yellow">
          <span>🛡️</span> Admin Access
        </div>
        <h2 class="login-step-title">Admin Login</h2>
        <p class="login-step-subtitle">Enter your admin credentials to continue</p>

        <!-- UI only — not wired to a backend yet -->
        <form id="adminLoginForm" class="login-form">
          <div class="form-group">
            <label for="adminEmail">Email</label>
            <input type="email" id="adminEmail" required placeholder="admin@blinklist.com" autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="adminPassword">Password</label>
            <input type="password" id="adminPassword" required placeholder="••••••••" autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-primary login-submit-btn">Login as Admin</button>
        </form>

        <div class="login-divider"><span>or continue with</span></div>

        <div class="social-login-row">
          <button class="social-btn" type="button" title="Continue with Google">
            <svg width="18" height="18" viewBox="0 0 18 18">
              <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
              <path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>
              <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.167 6.656 3.58 9 3.58z"/>
            </svg>
            Google
          </button>
          <button class="social-btn" type="button" title="Continue with Microsoft">
            <svg width="18" height="18" viewBox="0 0 24 24">
              <rect x="2" y="2" width="9" height="9" fill="#F25022"/>
              <rect x="13" y="2" width="9" height="9" fill="#7FBA00"/>
              <rect x="2" y="13" width="9" height="9" fill="#00A4EF"/>
              <rect x="13" y="13" width="9" height="9" fill="#FFB900"/>
            </svg>
            Microsoft
          </button>
          <button class="social-btn" type="button" title="Continue with Apple">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M16.365 1.43c0 1.14-.462 2.24-1.19 3.04-.79.87-2.08 1.55-3.15 1.46-.13-1.09.44-2.25 1.16-3.02.8-.86 2.19-1.5 3.18-1.48zM20.5 17.36c-.55 1.27-.82 1.84-1.53 2.96-.99 1.56-2.39 3.5-4.12 3.51-1.54.02-1.93-.99-4.02-.98-2.09.01-2.52 1-4.06.98-1.73-.02-3.06-1.77-4.05-3.33C.34 17.02-.5 12.32 1.6 9.14c1.09-1.66 2.86-2.68 4.51-2.68 1.7 0 2.76 1 4.17 1 1.37 0 2.19-1 4.17-1 1.53 0 3.14.83 4.29 2.27-3.78 2.07-3.17 7.43 1.76 8.63z"/>
            </svg>
            Apple
          </button>
        </div>
      </section>

    </div>
  </div>

  <!-- JS (login page only) -->
  <script src="login.js"></script>
</body>
</html>
